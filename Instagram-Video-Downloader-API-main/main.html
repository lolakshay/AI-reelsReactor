<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reel Downloader</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #111827;
        }
        .container {
            max-width: 800px;
        }
        .card {
            background-color: #1f2937;
        }
        .form-input, .btn {
            border-radius: 0.5rem;
        }
        .form-input {
            background-color: #374151;
            border: 1px solid #4b5563;
            color: #d1d5db;
        }
        .btn-primary {
            background-color: #4f46e5;
            transition: background-color 0.2s;
        }
        .btn-primary:hover {
            background-color: #6366f1;
        }
    </style>
</head>
<body class="p-8 flex items-center justify-center min-h-screen">

    <div class="container mx-auto p-6 space-y-6">

        <div class="card rounded-lg p-6 text-center text-white">
            <h1 class="text-3xl font-bold mb-2">Reel Downloader</h1>
            <p class="text-gray-400">Paste a public Instagram Reel URL to start the download.</p>
        </div>

        <div class="card rounded-lg p-6">
            <div class="flex flex-col md:flex-row space-y-4 md:space-y-0 md:space-x-4">
                <input type="text" id="reel-url" placeholder="Paste Instagram Reel URL here..." class="form-input w-full p-3 text-sm focus:ring-indigo-500 focus:border-indigo-500">
                <button id="download-btn" class="btn btn-primary text-white p-3 font-bold text-sm">Download</button>
            </div>
            <p id="error-message" class="text-red-400 text-sm mt-4 hidden">An error occurred. Please check the URL and your server connection.</p>
        </div>

        <div class="card rounded-lg p-6">
            <div id="video-display" class="relative rounded-lg overflow-hidden w-full aspect-video flex items-center justify-center">
                <p id="placeholder-text" class="absolute inset-0 flex items-center justify-center text-gray-500 text-lg">Your video will appear here.</p>
            </div>
        </div>
    </div>

    <script>
        // --- START OF MODIFIED SCRIPT ---

        const urlInput = document.getElementById('reel-url');
        const videoDisplay = document.getElementById('video-display');
        const errorMessage = document.getElementById('error-message');
        
        let debounceTimeout;

        // This is the main function that handles the download
        const startDownload = async () => {
            const reelUrl = urlInput.value;

            // Simple check to see if the text looks like an Instagram URL
            const reelRegex = /https:\/\/(www\.)?instagram\.com\/reel\//;
            if (!reelRegex.test(reelUrl)) {
                // Do nothing if it's not a valid-looking URL
                return; 
            }

            errorMessage.classList.add('hidden');
            videoDisplay.innerHTML = '<div class="absolute inset-0 flex items-center justify-center text-white text-lg">Loading...</div>';

            try {
                const API_URL = `http://localhost:3000/igdl?url=${encodeURIComponent(reelUrl)}`;
                const response = await fetch(API_URL);

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                const videoFileUrl = data.url.data[0].url;

                if (!videoFileUrl) {
                     throw new Error('Video URL not found in the response.');
                }

                videoDisplay.innerHTML = `
                    <video controls autoplay class="w-full h-full object-contain">
                        <source src="${videoFileUrl}" type="video/mp4">
                        Your browser does not support the video tag.
                    </video>
                `;

                const link = document.createElement('a');
                link.href = videoFileUrl;
                link.setAttribute('download', 'reel.mp4'); 
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);

            } catch (error) {
                console.error('Error:', error);
                errorMessage.classList.remove('hidden');
                videoDisplay.innerHTML = '<p id="placeholder-text" class="absolute inset-0 flex items-center justify-center text-gray-500 text-lg">An error occurred. Please check your URL and server connection.</p>';
            }
        };

        // Listen for input events (typing, pasting) on the URL field
        urlInput.addEventListener('input', () => {
            // Clear the previous timeout
            clearTimeout(debounceTimeout);
            // Set a new timeout to run the download function after 500ms
            debounceTimeout = setTimeout(startDownload, 500);
        });
        
        // The button can be kept as a manual backup
        document.getElementById('download-btn').addEventListener('click', startDownload);

        // --- END OF MODIFIED SCRIPT ---
    </script>
</body>
</html>
